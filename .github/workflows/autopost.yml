name: Autopost Socials
on:
  workflow_run:
    workflows: ["Deploy Quartz site to GitHub Pages"]
    types:
      - completed

permissions:
  contents: write

jobs:
  autopost:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run autopost
        env:
          MASTODON_BASE: ${{ secrets.MASTODON_BASE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BSKY_USERNAME: ${{ secrets.BSKY_USERNAME }}
          BSKY_APP_PASS: ${{ secrets.BSKY_APP_PASS }}
        run: node scripts/post-to-social.mjs

      - name: Commit updated last-social-post.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-social-post.json
          git diff --cached --quiet || git commit -m "Update last-social-post.json"
          git push
